<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生物样本冷链接收放行台</title><link rel="stylesheet" href="/static/style.css"></head><body><main><header><h1>生物样本冷链接收放行台</h1><p>运输证据登记、风险审核与放行凭据</p></header><section class="toolbar"><input id="keyword" placeholder="案卷编号"><select id="status"><option value="">全部状态</option><option>草拟</option><option>证据采集中</option><option>待审核</option><option>已退回</option><option>待复审</option><option>已批准</option><option>已放行</option></select><select id="window-phase"><option value="">全部窗口阶段</option><option>未开始</option><option>进行中</option><option>已结束</option></select><input id="due-minutes" type="number" min="0" placeholder="临期分钟"><button id="search">筛选</button><button id="new">创建案卷</button><button id="page-prev" disabled>上一页</button><button id="page-next" disabled>下一页</button><span id="page-state"></span></section><section id="stats" class="stats"></section><section id="cases"></section><section id="detail" hidden></section><section class="panel"><h2>凭据核验</h2><div class="row"><input id="credential" placeholder="凭据编号或案卷 ID，多个用逗号分隔"><button id="verify">核验</button><pre id="verify-result"></pre></div></section></main><script src="/static/app.js"></script></body></html>
